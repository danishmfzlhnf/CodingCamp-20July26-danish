<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <div class="header-balance">
      <span class="balance-label">Total Balance</span>
      <span class="balance-amount" id="balance-display">$0.00</span>
    </div>
    <div class="header-controls">
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light mode">
        🌙 Dark Mode
      </button>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="app-main">

    <!-- Storage warning banner (hidden by default) -->
    <div class="storage-warning" id="storage-warning" role="alert" hidden>
      ⚠️ Local storage is unavailable. Your data will not be saved between sessions.
    </div>

    <!-- Chart.js CDN unavailability fallback (hidden by default) -->
    <div class="chart-fallback" id="chart-fallback" hidden>
      <h3>Category Totals</h3>
      <ul id="chart-fallback-list"></ul>
    </div>

    <div class="content-grid">

      <!-- LEFT COLUMN: Input Form + Transaction List -->
      <section class="transactions-section" aria-label="Transactions">

        <!-- Input Form -->
        <form class="transaction-form" id="transaction-form" novalidate>
          <h2 class="section-title">Add Expense</h2>

          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="item-name"
              placeholder="e.g. Lunch"
              autocomplete="off"
            />
            <span class="field-error" id="name-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input
              type="number"
              id="amount"
              name="amount"
              placeholder="e.g. 12.50"
              min="0.01"
              step="0.01"
            />
            <span class="field-error" id="amount-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="">-- Select a category --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span class="field-error" id="category-error" role="alert" aria-live="polite"></span>
          </div>

          <button type="submit" class="btn btn-primary">Add Transaction</button>
        </form>

        <!-- Transaction List Controls -->
        <div class="list-controls">
          <h2 class="section-title">Transactions</h2>
          <div class="list-actions">
            <label for="sort-select" class="sr-only">Sort by</label>
            <select id="sort-select" name="sort" aria-label="Sort transactions">
              <option value="">-- Sort by --</option>
              <option value="amount-asc">Amount: Low to High</option>
              <option value="amount-desc">Amount: High to Low</option>
              <option value="category-asc">Category: A–Z</option>
            </select>
            <button class="btn btn-secondary view-toggle" id="view-toggle" aria-pressed="false">
              📅 Monthly View
            </button>
          </div>
        </div>

        <!-- Transaction List -->
        <ul class="transaction-list" id="transaction-list" aria-label="Transaction list" aria-live="polite">
          <!-- Transactions rendered here by app.js -->
        </ul>

        <!-- Empty state (shown when list is empty) -->
        <p class="empty-state" id="empty-state">No expenses recorded yet. Add one above!</p>

      </section>

      <!-- RIGHT COLUMN: Chart -->
      <section class="chart-section" aria-label="Spending chart">
        <h2 class="section-title">Spending by Category</h2>
        <div class="chart-container">
          <canvas id="spending-chart" aria-label="Pie chart of spending by category" role="img"></canvas>
        </div>
      </section>

    </div><!-- /.content-grid -->

  </main>

  <!-- ===== MONTHLY SUMMARY SECTION ===== -->
  <section class="monthly-summary" id="monthly-summary" aria-label="Monthly summary" hidden>
    <h2 class="section-title">Monthly Summary</h2>
    <div class="monthly-summary-list" id="monthly-summary-list" aria-live="polite">
      <!-- Monthly groups rendered here by app.js -->
    </div>
  </section>

  <!-- Chart.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <!-- App logic -->
  <script src="js/app.js"></script>

</body>
</html>
